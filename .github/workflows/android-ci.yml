name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same branch/PR supersedes the older one.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the Android command-line tools and accepts the SDK licences so Gradle can
      # download the compile SDK platform if the runner image does not ship it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Caches Gradle and verifies the checksum of gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug and release (release runs R8)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Debug builds skip R8, so only the release mapping can show that R8 renamed or removed a model
      # that Gson or Firestore reads by name. The reports below are still uploaded when this fails.
      - name: Check that R8 kept the data models
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/check_release_mapping.py app/build/outputs/mapping/release/mapping.txt

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/

      # The R8 mapping explains obfuscated release crashes and shows which classes were renamed.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
